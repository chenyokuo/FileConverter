[package]
name = "file-converter"
version = "1.0.0-rc.1"
description = "Offline universal converter for Windows"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infer = "=0.22.0"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.1"

[[bin]]
name = "FileConverter"
path = "src/main.rs"
