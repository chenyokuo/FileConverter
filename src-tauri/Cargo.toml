[package]
name = "file-converter"
version = "1.1.0-rc.3"
description = "Offline universal converter for Windows"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infer = "=0.22.0"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
minisign-verify = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.1"

[[bin]]
name = "FileConverter"
path = "src/main.rs"
